<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Chat Log Render 截图生成</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    padding: 32px;
    background: #FFFFFF;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }
  .shot {
    background: #FFFFFF;
    padding: 20px 24px;
    width: 640px;
    box-sizing: border-box;
  }
  .shot-label {
    font-size: 13px;
    color: #666;
    margin-bottom: 12px;
  }
  /* 模拟 Obsidian 代码块外观 */
  .cb {
    border: 0.5px solid #D8D8D8;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .cb-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #F2F2F2;
    padding: 5px 12px;
    font-size: 11px;
    color: #888;
  }
  .cb-lang {
    font-family: Consolas, Menlo, monospace;
    background: #E4E4E4;
    border-radius: 4px;
    padding: 1px 8px;
    color: #555;
  }
  .cb pre {
    margin: 0;
    padding: 12px 14px;
    font-family: Consolas, Menlo, 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.55;
    color: #383A42;
    background: #FAFAFA;
    white-space: pre;
  }
  .arrow {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin: 6px 0 10px;
  }
  .shot .wcr-chat { max-width: 560px; margin: 0 auto; }
</style>
</head>
<body>

<div class="shot" id="shot1">
  <div class="shot-label">1 · Write the code block → get the chat card（写代码块 → 得到聊天卡片）</div>
</div>

<div class="shot" id="shot2">
  <div class="shot-label">2 · Media, system lines &amp; right-side bubbles（媒体消息、系统提示与右侧绿气泡）</div>
</div>

<script>
// Polyfill：Obsidian 给 HTMLElement 扩展了 addClass/removeClass/empty，原生浏览器没有
if (!Element.prototype.addClass) {
  Element.prototype.addClass = function (...cls) { this.classList.add(...cls); return this; };
}
if (!Element.prototype.removeClass) {
  Element.prototype.removeClass = function (...cls) { this.classList.remove(...cls); return this; };
}
if (!Element.prototype.empty) {
  Element.prototype.empty = function () { while (this.firstChild) this.removeChild(this.firstChild); return this; };
}
</script>
<script>
(async function () {
  try {
    // 在浏览器里手动构造一个「剥依赖」的 main.js：把 require 行替换掉后执行
    const res = await fetch('../main.js');
    let src = await res.text();
    src = src.replace("const obsidian = require('obsidian');", 'const obsidian = {};');
    const cut = src.indexOf('/* ---------- 插件主体');
    if (cut > 0) src = src.slice(0, cut);
    src += '\nreturn { parseChat, renderChat };';
    const { parseChat, renderChat } = new Function(src)();

    const settings = { myName: '木仔建', showAvatar: true };

    /* 示例 1：基础用法（昵称行+时间行格式），全部为虚构数据 */
    const chat1 = [
      '# 周六爬山小分队 (5)',
      '',
      '小林',
      '11月19日 08:30',
      '这周六去爬白云山，早上七点半地铁站集合？',
      '',
      '阿哲',
      '11月19日 08:41',
      '可以，我带上水和干粮',
      '',
      '木仔建',
      '11月19日 08:45',
      '算我一个，天气预报说周六多云转晴',
      '',
      '小林',
      '11月19日 08:47',
      '那就定了，人到齐了群里发接龙'
    ].join('\n');
    const src1 = '```wechat\n' + chat1 + '\n```';

    /* 示例 2：媒体消息 + 系统提示 + 右侧气泡，全部为虚构数据 */
    const chat2 = [
      '阿哲',
      '11月19日 09:12',
      '[图片] IMG_20261119_085233.jpg',
      '',
      '阿哲',
      '11月19日 09:15',
      '[文件] 白云山登山路线图.pdf',
      '',
      '木仔建',
      '11月19日 09:16',
      '收到，周六见！',
      '',
      '> 以上为合并转发消息'
    ].join('\n');
    const src2 = '```chat\n' + chat2 + '\n```';

    function addShot(elId, fenceSrc, chatSrc, lang) {
      const shot = document.getElementById(elId);
      const cb = document.createElement('div');
      cb.className = 'cb';
      cb.innerHTML = '<div class="cb-head"><span>source 源码</span><span class="cb-lang"></span></div>';
      cb.querySelector('.cb-lang').textContent = lang;
      const pre = document.createElement('pre');
      pre.textContent = fenceSrc;
      cb.appendChild(pre);
      shot.appendChild(cb);
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '↓ 渲染效果 rendered ↓';
      shot.appendChild(arrow);
      renderChat(shot.appendChild(document.createElement('div')), parseChat(chatSrc), settings);
    }

    addShot('shot1', src1, chat1, 'wechat');
    addShot('shot2', src2, chat2, 'chat');

    // ?only=shot1 / ?only=shot2：截图时只显示指定卡片
    const only = new URLSearchParams(location.search).get('only');
    if (only === 'shot1') document.getElementById('shot2').style.display = 'none';
    if (only === 'shot2') document.getElementById('shot1').style.display = 'none';
    window.__ready = true;
  } catch (e) {
    document.title = 'ERR: ' + (e && e.message || e);
    const el = document.createElement('pre');
    el.style.color = '#A32D2D';
    el.textContent = String(e && e.stack || e);
    document.body.prepend(el);
    window.__ready = true;
  }
})();
</script>
</body>
</html>
